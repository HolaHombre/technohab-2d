<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" data-technohab-sprite="room-icons">
  <!-- Pictogrammes de pièces, vue de dessus, selon DA_ICONES_PLAN.md.
       viewBox commun 0 0 64 64, trait uniforme en currentColor.
       data-orient : proportion naturelle du dessin.
       data-rotatable : le pictogramme accepte un quart de tour lorsque la
       pièce est orientée dans l'autre sens (mobilier orientable). -->

  <symbol id="icon-living" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" data-orient="landscape" data-rotatable="true">
