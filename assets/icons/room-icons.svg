  <!-- Fonctions du référentiel qui partagent un glyphe (technohab_rules.md §1). -->
  <symbol id="icon-salon" viewBox="0 0 64 64" data-orient="landscape" data-rotatable="true"><use href="#icon-living" /></symbol>
