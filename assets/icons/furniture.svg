<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" data-technohab-sprite="furniture">
  <!-- Mobilier et équipements, vue de dessus, à l'échelle.
       Dessins repris de la planche `assets/generated/mobilier-cote.png`,
       cotes alignées sur SOCLE_AGENCEMENT.md §5 qui fait foi.

       Le viewBox est exprimé en CENTIMÈTRES et vaut l'emprise dessinée.
       Le moteur place cette emprise en mètres puis applique autour de son
       centre la rotation cardinale calculée par le solveur.

       L'identifiant sans le préfixe `furn-` est la clé de jointure avec
       `equipments[].id` du socle. Zone d'usage, ancrage, réseaux et caractère
       obligatoire vivent dans le socle et ne sont pas dupliqués ici — ce
       fichier porte le dessin, pas la règle.

       data-w, data-h ....... emprise de l'équipement en mètres ; égale au
                              viewBox sauf lorsque le dessin inclut une assise
       data-stretch ......... "x" si la longueur est variable (linéaires) ;
                              au-delà d'environ 30 % d'étirement, poser
                              plusieurs modules plutôt que déformer le dessin
       data-rotatable ....... accepte 90 / 180 / 270 degrés

       Trait uniforme de 2 cm réels ; contours tracés à 1 cm du bord pour que
       le trait reste dans l'emprise. -->

  <symbol id="furn-sofa" viewBox="0 0 180 90" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" data-label="Canapé" data-w="1.80" data-h="0.90" data-rotatable="true">
    <path d="M1 1h178v88H1z" />
    <path d="M24 1v88M156 1v88" />
